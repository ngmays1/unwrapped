<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f4efe4">
    <meta name="description" content="Your year in listening, unwrapped.">
    <title>unwrapped: {{ year }} in review</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="preload" href="/static/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/static/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="container header-inner">
            <a class="wordmark" href="/">unwrapped</a>
            <nav class="site-nav" aria-label="Primary">
                <a href="/">Explore</a>
                <a href="/wrapped/{{ year }}" aria-current="page">Wrapped</a>
            </nav>
        </div>
    </header>

    <main id="main" class="container" tabindex="-1">
        <noscript>
            <p class="empty-state">This page needs JavaScript to load the year in review.</p>
        </noscript>

        <div id="wrapped" class="wrapped" data-year="{{ year }}">
            <p class="loading">Loading {{ year }}...</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>unwrapped. Built from your ListenBrainz history.</p>
            <p><a href="/">Back to the listening archive</a></p>
        </div>
    </footer>

    <script src="/static/wrapped.js" defer></script>
</body>
</html>
